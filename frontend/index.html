<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>Your Library</h2>
      <ul>
        <li>Playlists</li>
        <li>Liked Songs</li>
        <li>Albums</li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
      <!-- SEARCH BAR -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs, artists, albums...">
        <button id="searchBtn"></button>
      </div>

      <h2>Recommended for you</h2>

      <div class="cards">

        <div class="card" data-title="Phonk" data-img="assets/images/album1.jpg">
          <div class="card-img">
            <img src="assets/images/album1.jpg">
            <button class="play-btn">▶</button>
          </div>
          <h4>Phonk</h4>
          <audio src="assets/songs/song1.mp3"></audio>
        </div>

        <div class="card" data-title="Phonk" data-img="assets/images/album2.jpg">
          <div class="card-img">
            <img src="assets/images/album2.jpg">
            <button class="play-btn">▶</button>
          </div>
          <h4>Phonk</h4>
          <audio src="assets/songs/song2.mp3"></audio>
        </div>

        <div class="card" data-title="Suzume" data-img="assets/images/album3.jpg">
          <div class="card-img">
            <img src="assets/images/album3.jpg">
            <button class="play-btn">▶</button>
          </div>
          <h4>Suzume</h4>
          <audio src="assets/songs/song3.mp3"></audio>
        </div>

      </div>
    </main>

  </div>

  <!-- BOTTOM PLAYER -->
  <div class="player">
    <div class="player-left">
      <img src="assets/images/album1.jpg">
      <div>
        <h4>Song</h4>
      </div>
    </div>

    <div class="player-center">

  <!-- LEFT: CONTROLS -->
  <div class="controls">
    <button id="shuffle">🔀</button>
    <button id="prev">⏮</button>
    <button id="playPause" class="big">▶</button>
    <button id="next">⏭</button>
    <button id="repeat">🔁</button>
  </div>

  <!-- RIGHT: PROGRESS BAR -->
  <div class="spotify-progress">
    <span id="currentTime">0:00</span>

    <div class="progress-container">
      <div class="progress-bg">
        <div class="progress-fill"></div>
        <div class="progress-thumb"></div>
      </div>
    </div>

    <span id="duration">0:00</span>
  </div>

</div>


  </div>
  <script src="js/script.js"></script>
</body>

</html>
